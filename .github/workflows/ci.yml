name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Integration tests (python-dbusmock NetworkManager template)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q python3-dbusmock dbus python3-gi
          BNM_INTEGRATION=1 go test -tags integration -count=1 ./internal/nm/...
      - name: Build static binaries
        run: make build

  # The Tauri 2 desktop app: React frontend (desktop/) + Rust shell (desktop/src-tauri).
  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux deps
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      # cargo test runs tests/daemon_live.rs against a real `bnmd --fake`, which it builds with go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Shell
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build (binary only; the release workflow bundles)
        run: pnpm tauri build --no-bundle

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: nix build .#bnm (keeps vendorHash honest)
        run: nix build .#bnm --print-build-logs
      # webkitgtk + a full Rust release build: too slow for every PR, so main only.
      - name: nix build .#bnm-desktop (keeps the pnpm hash and Cargo.lock honest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix build .#bnm-desktop --print-build-logs
