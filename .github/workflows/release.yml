name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # re-run on an existing tag: pick the tag as the ref

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests before releasing
        run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

  # The Tauri desktop app, built natively per arch on the oldest supported LTS so the
  # AppImage's glibc floor stays low. Uploads AppImage, deb and rpm to the release that
  # goreleaser created. The version comes from the tag: tauri.conf.json has no version
  # key, so bundle names and CARGO_PKG_VERSION both follow src-tauri/Cargo.toml, which
  # is rewritten from the tag here (0.1.0 in git). Cargo updates its own Cargo.lock entry.
  desktop:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux deps
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here on purpose: a cache restored from the CI job left cargo
      # with fingerprints but no rlibs ("can't find crate for tauri"). A cold
      # release build costs a few minutes and happens once per tag.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Build bundles (AppImage, deb, rpm)
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \".*\"$/s//version = \"${version}\"/" src-tauri/Cargo.toml
          grep -n '^version' src-tauri/Cargo.toml
          pnpm install --frozen-lockfile
          pnpm tauri build
          ls -l src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm
